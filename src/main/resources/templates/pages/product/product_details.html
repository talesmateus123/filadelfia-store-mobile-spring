<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}">
</head>
<body>
    <header th:replace="~{layout :: header}">
    </header>
    
    <div class="container">
        <div id="produtos" class="tab-content active">
            <div class="section-title">
                <h2 th:text="${pageTitle}"></h2>
                <div class="action-buttons">
                    <button type="button" class="btn btn-primary btn-sm" th:onclick="|window.location.href='@{/products/edit/{id}(id=${product.id})}'|">
                        <img th:src="@{/images/ion-icons/svg/create-outline.svg}" alt="Editar">
                    </button>
                    <form th:if="${product.active}" th:action="@{/products/delete/{id}(id=${product.id})}" method="post" 
                          onsubmit="return confirm('Tem certeza que deseja desabilitar este produto?')">
                        <button type="submit" class="btn btn-danger btn-sm" title="Desabilitar produto">
                            <img th:src="@{/images/ion-icons/svg/trash-outline.svg}" alt="">
                        </button>
                    </form>
                    <form th:if="${!product.active}" th:action="@{/products/activate/{id}(id=${product.id})}" method="post" 
                          onsubmit="return confirm('Tem certeza que deseja ativar este produto?')">
                        <button type="submit" class="btn btn-success btn-sm" title="Ativar produto">
                            <img th:src="@{/images/ion-icons/svg/checkmark-circle-outline.svg}" alt="">
                        </button>
                    </form>
                    <form th:if="${product.featured}" th:action="@{/products/set-featured/{id}(id=${product.id})}" method="post" 
                          onsubmit="return confirm('Remover produto dos destaques?')">
                        <input type="hidden" name="featured" value="false">
                        <button type="submit" class="btn btn-warning btn-sm" title="Remover dos destaques">
                            <img th:src="@{/images/ion-icons/svg/star.svg}" alt="">
                        </button>
                    </form>
                    <form th:if="${!product.featured}" th:action="@{/products/set-featured/{id}(id=${product.id})}" method="post" 
                          onsubmit="return confirm('Marcar produto como destaque?')">
                        <input type="hidden" name="featured" value="true">
                        <button type="submit" class="btn btn-outline-warning btn-sm" title="Marcar como destaque">
                            <img th:src="@{/images/ion-icons/svg/star-outline.svg}" alt="">
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Display flash messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            
            <!-- Product Information -->
            <div class="product-info-section">
                <div class="product-details">
                    <p><b>Nome:</b>&nbsp;<span th:text="${product.name}"></span></p>
                    <p><b>Descrição:</b>&nbsp;<span th:text="${product.description}"></span></p>
                    <p><b>Preço:</b>&nbsp;<span th:text="${product.priceFormatted}"></span></p>
                    <p><b>Estoque:</b>&nbsp;<span th:text="${product.stock}"></span></p>
                    <p><b>Ativo:</b>&nbsp;<span th:text="${product.active} ? 'Sim' : 'Não'"></span></p>
                    <p><b>Produto em Destaque:</b>&nbsp;<span th:text="${product.featured} ? 'Sim' : 'Não'"></span></p>
                </div>

                <!-- Product Image Section -->
                <div class="product-image-section">
                    <h3>Imagem do Produto</h3>
                    
                    <!-- Current Image Display -->
                    <div class="current-image">
                        <div class="image-container" th:if="${product.imageUrl != null and not #strings.isEmpty(product.imageUrl)}" 
                             style="position: relative; display: inline-block;">
                            <form th:action="@{/products/{id}/delete-image(id=${product.id})}" 
                                  method="post" 
                                  th:onsubmit="return confirm('Tem certeza que deseja remover a imagem do produto?')"
                                  style="position: absolute; top: 8px; right: 8px; z-index: 2;">
                                <button type="submit" 
                                        class="btn btn-danger btn-sm" 
                                        style="width: 32px; height: 32px; min-width: 32px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1rem; line-height: 1;">
                                    ×
                                </button>
                            </form>
                            <img th:src="${product.imageUrl}" 
                                 th:alt="${product.name}" 
                                 class="product-image-preview">
                            <p class="image-info">Imagem atual do produto</p>
                        </div>
                        <div class="no-image" th:unless="${product.imageUrl != null and not #strings.isEmpty(product.imageUrl)}">
                            <div class="placeholder-image">
                                <span>📦 Nenhuma imagem</span>
                            </div>
                            <p class="image-info">Nenhuma imagem definida para este produto</p>
                        </div>
                    </div>

                    <!-- Image Upload Form -->
                    <div class="image-upload-section" th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}">
                        <h4>Enviar Nova Imagem</h4>
                        <form th:action="@{/products/{id}/upload-image(id=${product.id})}" 
                              method="post" 
                              enctype="multipart/form-data" 
                              class="upload-form">
                            
                            <div class="form-group">
                                <label for="imageFile">Escolher Imagem:</label>
                                <input type="file" 
                                       id="imageFile" 
                                       name="imageFile" 
                                       accept="image/*" 
                                       class="file-input"
                                       onchange="previewImage(this)">
                                <small class="form-text">
                                    Formatos aceitos: JPG, PNG, GIF, WEBP (máximo 5MB)
                                </small>
                            </div>

                            <!-- Image Preview -->
                            <div id="imagePreview" class="image-preview" style="display: none;">
                                <img id="previewImg" src="" alt="Preview">
                                <p>Preview da nova imagem</p>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    📤 Enviar Imagem
                                </button>
                                <button type="button" 
                                        class="btn btn-secondary" 
                                        onclick="clearImagePreview()">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}">
    </footer>
    
    <div th:replace="~{common/modal :: modal-manager}">
    </div>

    <div th:replace="~{layout :: scripts}">
    </div>
    
    <!-- Image Preview JavaScript -->
    <script>
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                };
                
                reader.readAsDataURL(input.files[0]);
            } else {
                clearImagePreview();
            }
        }
        
        function clearImagePreview() {
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            const fileInput = document.getElementById('imageFile');
            
            preview.style.display = 'none';
            previewImg.src = '';
            fileInput.value = '';
        }
    </script>
    
</body>
</html>
