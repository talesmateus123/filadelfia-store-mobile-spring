<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}">
</head>
<body>
    <header th:replace="~{layout :: header}">
    </header>

    <div class="container">
        <div id="produtos" class="tab-content active">
            <h2 class="section-title" th:text="${pageTitle}"></h2>
            
            <div class="form-container" th:if="${productDTO != null}">
                <form id="form-produto"
                    th:object="${productDTO}"
                    th:action="${isEdit} ? @{/products/edit/{id}(id=*{id})} : @{/products/create}"
                    method="post"
                    enctype="multipart/form-data">
                    <input type="hidden" id="produto-id" name="id" th:field="*{id}" th:if="${isEdit}">
                    <div class="form-group">
                        <label for="produto-nome">Nome do Produto</label>
                        <input type="text" id="produto-nome" th:field="*{name}" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-descricao">Descrição:</label>
                        <textarea id="produto-descricao" th:field="*{description}" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="produto-categoria">Categoria</label>
                        <select id="produto-categoria" th:field="*{categoryId}">
                            <option value="">Selecione uma categoria</option>
                            <option value="0">Nova Categoria</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                        <small class="form-text">Selecione uma categoria existente ou escolha "Nova Categoria" para informar uma categoria nova.</small>
                    </div>
                    <div id="new-category-fields" class="form-group" style="display: none;">
                        <label for="new-category-name">Nome da nova categoria</label>
                        <input type="text" id="new-category-name" th:field="*{newCategoryName}" placeholder="Nome da nova categoria">
                    </div>
                    <div id="new-category-description-group" class="form-group" style="display: none;">
                        <label for="new-category-description">Descrição da Nova Categoria</label>
                        <textarea id="new-category-description" th:field="*{newCategoryDescription}" rows="2" placeholder="Descrição opcional"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="produto-preco">Preço (R$)</label>
                        <input type="text" id="produto-preco" th:field="*{price}" placeholder="R$ 0,00" inputmode="decimal" required
                               onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" oninput="maskCurrencyOnInput(this)">
                    </div>
                    <div class="form-group">
                        <label for="produto-estoque">Quantidade em Estoque</label>
                        <input type="number" id="produto-estoque" th:field="*{stock}" min="0" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="produto-featured" th:field="*{featured}">
                        <label for="produto-featured">Destacar produto</label>
                    </div>
                    <div class="form-group">
                        <label for="produto-ativo">Ativo</label>
                        <input type="checkbox" id="produto-ativo" th:field="*{active}" checked>
                    </div>
                    
                    <!-- Product Image Upload -->
                    <div class="form-group">
                        <label for="produto-imagem">Imagem do Produto</label>
                        <input type="file" 
                               id="produto-imagem" 
                               name="imageFile" 
                               accept="image/*" 
                               class="file-input"
                               onchange="previewImageCreate(this)">
                        <small class="form-text">
                            Formatos aceitos: JPG, PNG, GIF, WEBP (máximo 5MB)
                        </small>
                        
                        <!-- Current Image Display (for edit mode) -->
                        <div th:if="${isEdit != null and isEdit and productDTO != null and productDTO.imageUrl != null and not #strings.isEmpty(productDTO.imageUrl)}" 
                             class="current-image-display">
                            <p>Imagem atual:</p>
                            <img th:src="${productDTO.imageUrl}" 
                                 th:alt="${productDTO.name}" 
                                 class="current-product-image">
                        </div>
                        
                        <!-- Image Preview -->
                        <div id="imagePreviewCreate" class="image-preview" style="display: none;">
                            <img id="previewImgCreate" src="" alt="Preview">
                            <p>Preview da nova imagem</p>
                        </div>
                    </div>

                   <div th:replace="~{layout :: notifications}"></div>
                   
                   <!-- Display validation errors -->
                   <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                       <ul>
                           <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                       </ul>
                   </div>
                   
                   <!-- Display error message -->
                   <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <div class="form-actions">
                        <button type="button" id="btn-cancelar" class="danger" onclick="history.back()">Cancelar</button>
                        <button type="submit" id="btn-salvar" class="success">Salvar Produto</button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>

    <footer th:replace="~{layout :: footer}">
    </footer>
    
    <div th:replace="~{common/modal :: modal-manager}">
    </div>

    <div th:replace="~{layout :: scripts}">
    </div>
    
    <!-- Image Preview JavaScript for Create/Edit -->
    <script>
        function previewImageCreate(input) {
            const preview = document.getElementById('imagePreviewCreate');
            const previewImg = document.getElementById('previewImgCreate');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                };
                
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
                previewImg.src = '';
            }
        }

        function toggleNewCategoryFields() {
            const categoriaSelect = document.getElementById('produto-categoria');
            const newCategoryFields = document.getElementById('new-category-fields');
            const newCategoryDescriptionGroup = document.getElementById('new-category-description-group');
            const selectedValue = categoriaSelect.value;

            if (selectedValue === '0') {
                newCategoryFields.style.display = 'block';
                newCategoryDescriptionGroup.style.display = 'block';
            } else {
                newCategoryFields.style.display = 'none';
                newCategoryDescriptionGroup.style.display = 'none';
            }
        }

        function maskCurrencyOnInput(input) {
            if (!input) return;
            const numeric = parseCurrencyValue(input.value);
            if (isNaN(numeric)) {
                input.value = '';
                return;
            }
            input.value = numeric.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseCurrencyValue(value) {
            if (!value) return NaN;
            let cleaned = value.toString().trim();
            cleaned = cleaned.replace(/\s/g, '');
            cleaned = cleaned.replace(/[^0-9.,]/g, '');

            if (cleaned === '') {
                return NaN;
            }

            if (cleaned.includes(',') && cleaned.includes('.')) {
                cleaned = cleaned.replace(/\./g, '');
                cleaned = cleaned.replace(/,/g, '.');
            } else if (cleaned.includes(',') && !cleaned.includes('.')) {
                cleaned = cleaned.replace(/,/g, '.');
            } else if (!cleaned.includes(',') && cleaned.includes('.')) {
                const lastDot = cleaned.lastIndexOf('.');
                cleaned = cleaned.slice(0, lastDot).replace(/\./g, '') + '.' + cleaned.slice(lastDot + 1);
            }

            return parseFloat(cleaned);
        }

        function formatCurrency(input) {
            if (!input) return;
            const numeric = parseCurrencyValue(input.value);
            if (isNaN(numeric)) {
                input.value = '';
                return;
            }
            input.value = numeric.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function unformatCurrency(input) {
            if (!input) return;
            const numeric = parseCurrencyValue(input.value);
            if (isNaN(numeric)) {
                input.value = '';
                return;
            }
            input.value = numeric.toFixed(2);
        }

        function normalizePriceField() {
            const priceInput = document.getElementById('produto-preco');
            if (!priceInput) return;
            const numeric = parseCurrencyValue(priceInput.value);
            priceInput.value = isNaN(numeric) ? '' : numeric.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const priceInput = document.getElementById('produto-preco');
            if (priceInput && priceInput.value) {
                formatCurrency(priceInput);
            }
            const categoriaSelect = document.getElementById('produto-categoria');
            const form = document.getElementById('form-produto');

            if (categoriaSelect) {
                categoriaSelect.addEventListener('change', toggleNewCategoryFields);
                toggleNewCategoryFields();
            }

            if (form) {
                form.addEventListener('submit', function() {
                    normalizePriceField();
                    if (categoriaSelect && categoriaSelect.value === '0') {
                        // Keep the sentinel value so backend can detect a new category.
                    }
                });
            }
        });
    </script>
    
</body>
</html>
